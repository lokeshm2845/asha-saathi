<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2A41">
  <title>ASHA Saathi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="phone">
    <header class="top">
      <div class="brand" data-go="home">
        <img src="icon.svg" alt="" width="34" height="34">
        <div>
          <div class="title">ASHA Saathi</div>
          <div class="sub" id="who">आशा साथी</div>
        </div>
      </div>
      <button class="net" id="netBtn" title="Tap to simulate offline / online"></button>
    </header>
    <div class="syncbar" id="syncbar"></div>
    <main id="view"></main>
    <nav class="tabs">
      <button data-go="home"><span>🏠</span>होम</button>
      <button data-go="visit"><span>🎤</span>विज़िट</button>
      <button data-go="register"><span>➕</span>नया</button>
      <button data-go="settings"><span>⚙️</span>सेटिंग</button>
    </nav>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../shared/engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
